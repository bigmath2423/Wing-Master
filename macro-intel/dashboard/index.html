<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Macro-Intel — Tableau de bord</title>
<style>
  :root { --bg:#0b0e14; --card:#151a23; --line:#232a36; --txt:#e6e9ef; --muted:#8b93a3;
          --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  .status { font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green);
         margin-right:6px; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main { padding:24px; display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .asset { text-transform:uppercase; font-size:13px; color:var(--muted); letter-spacing:1px; }
  .score { font-size:44px; font-weight:700; margin:4px 0; }
  .bias { display:inline-block; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .b-bullish{ background:rgba(34,197,94,.15); color:var(--green);}
  .b-bearish{ background:rgba(239,68,68,.15); color:var(--red);}
  .b-neutral{ background:rgba(139,147,163,.15); color:var(--muted);}
  .conf { font-size:13px; color:var(--muted); margin-top:6px; }
  .bar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar > i { display:block; height:100%; }
  .factors { margin-top:16px; display:grid; gap:8px; }
  .factor { display:flex; align-items:center; gap:10px; font-size:12px; }
  .factor .lbl { width:120px; color:var(--muted); }
  .factor .track { flex:1; height:6px; background:var(--line); border-radius:4px; position:relative; }
  .factor .fill { position:absolute; top:0; height:100%; border-radius:4px; }
  .factor .val { width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .risk { font-size:11px; padding:2px 8px; border-radius:6px; }
  .r-low{ background:rgba(34,197,94,.15); color:var(--green);}
  .r-medium{ background:rgba(245,158,11,.15); color:var(--amber);}
  .r-high{ background:rgba(239,68,68,.15); color:var(--red);}
  .news { padding:0 24px 32px; }
  .news h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .news ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .news li { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
             font-size:13px; display:flex; justify-content:space-between; gap:12px; }
  .news .tag { font-size:11px; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>🛰️ MACRO-INTEL · Contexte macro XAUUSD / BTC / Matières premières</h1>
  <div class="status"><span class="dot"></span><span id="updated">connexion…</span></div>
</header>
<main id="cards"></main>
<section class="news">
  <h2>Titres à plus fort impact</h2>
  <ul id="headlines"></ul>
</section>

<script>
const FACTOR_LABELS = {
  geopolitics:"Géopolitique", dollar:"Dollar (DXY)", us_rates:"Taux US",
  inflation:"Inflation", risk_sentiment:"Sentiment risque"
};
const BIAS_FR = { bullish:"HAUSSIER", bearish:"BAISSIER", neutral:"NEUTRE" };
const RISK_FR = { low:"FAIBLE", medium:"MOYEN", high:"ÉLEVÉ" };

function color(v){ return v>0 ? "var(--green)" : v<0 ? "var(--red)" : "var(--muted)"; }

function factorRow(key, val){
  const w = Math.min(Math.abs(val), 35) / 35 * 50; // 50% = demi-largeur (centre)
  const side = val >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`;
  return `<div class="factor">
    <span class="lbl">${FACTOR_LABELS[key]||key}</span>
    <span class="track"><span class="fill" style="${side};background:${color(val)}"></span></span>
    <span class="val" style="color:${color(val)}">${val>0?'+':''}${val.toFixed(0)}</span>
  </div>`;
}

function card(asset, d){
  const f = d.factors || {};
  const rows = Object.keys(FACTOR_LABELS).map(k => factorRow(k, f[k]||0)).join("");
  const width = (d.score+100)/2; // -100..100 -> 0..100
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="asset">${asset}</span>
      <span class="risk r-${d.risk_level}">RISQUE ${RISK_FR[d.risk_level]}</span>
    </div>
    <div class="score" style="color:${color(d.score)}">${d.score>0?'+':''}${d.score.toFixed(0)}<span style="font-size:16px;color:var(--muted)">/100</span></div>
    <span class="bias b-${d.bias}">${BIAS_FR[d.bias]}</span>
    <div class="conf">Confiance : <b>${d.confidence.toFixed(0)}%</b></div>
    <div class="bar"><i style="width:${width}%;background:${color(d.score)}"></i></div>
    <div class="factors">${rows}</div>
  </div>`;
}

function render(data){
  const order = ["gold","btc","commodities"];
  const labels = { gold:"XAUUSD · OR", btc:"BTC", commodities:"MATIÈRES PREMIÈRES" };
  document.getElementById("cards").innerHTML =
    order.filter(a=>data.assets[a]).map(a => card(labels[a], data.assets[a])).join("");
  document.getElementById("headlines").innerHTML =
    (data.headlines||[]).map(h => `<li><span>${h.title}</span>
      <span class="tag">${h.category} · impact or ${h.impact_gold>0?'+':''}${h.impact_gold.toFixed(0)}</span></li>`).join("")
      || '<li><span class="tag">Aucune news classifiée pour le moment.</span></li>';
  const t = new Date(data.generated_at);
  document.getElementById("updated").textContent = "Mis à jour : " + t.toLocaleTimeString("fr-FR");
}

// Flux temps réel via Server-Sent Events, repli sur polling.
function connect(){
  try {
    const es = new EventSource("/macro/stream/sse");
    es.onmessage = e => render(JSON.parse(e.data));
    es.onerror = () => { es.close(); poll(); };
  } catch(_) { poll(); }
}
function poll(){
  const tick = () => fetch("/macro/latest").then(r=>r.json()).then(render).catch(()=>{});
  tick(); setInterval(tick, 8000);
}
connect();
</script>
</body>
</html>
