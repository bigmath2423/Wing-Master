[project]
name = "macro-intel"
version = "1.0.0"
description = "Couche d'intelligence macro & géopolitique pour indicateur TradingView (XAUUSD, BTC, matières premières)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "SIM"]
# BLE001 (catch Exception) est un CHOIX d'architecture : les providers de
# données et le pipeline temps réel ne doivent jamais lever — ils basculent
# sur un repli. E501 : lignes denses volontaires dans les formules de scoring.
ignore = ["BLE001", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# Idiomes FastAPI : les appels en défaut d'argument sont volontaires.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["\\.venv"]
